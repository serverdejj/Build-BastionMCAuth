name: BastionMCAuth
version: 0.1.1-beta
main: mc.bastion.auth.BastionMCAuth
api-version: '1.21'
author: BASTION MC
description: Basic password authentication for offline-mode servers (beta)
commands:
  login:
    description: Iniciar sesion
    usage: /login <contraseña>
  register:
    description: Registrar cuenta
    usage: /register <contraseña> <confirmación>
  authsetspawn:
    description: Establecer spawn de autenticacion
    permission: bastionmcauth.admin.setspawn
permissions:
  bastionmcauth.admin.setspawn:
    description: Permite establecer el spawn de autenticacion
    default: op
